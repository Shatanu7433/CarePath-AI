<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CarePath AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#102A43;--blue:#3B82F6;--teal:#14B8A6;--bg:#F7FAFC;--card:#fff;--mut:#64748B;--line:#E2E8F0;--soft:#EEF4FB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#E6EEF7;--bg:#0B1623;--card:#122236;--mut:#9FB0C3;--line:#223750;--soft:#17304A}}
:root[data-theme="dark"]{--navy:#E6EEF7;--bg:#0B1623;--card:#122236;--mut:#9FB0C3;--line:#223750;--soft:#17304A}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{font:16px/1.5 Manrope,Inter,system-ui,sans-serif;background:var(--bg);color:var(--navy)}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.shell{display:flex;min-height:100%}
.side{display:none;width:240px;padding:20px 14px;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;flex-direction:column;gap:4px}
.main{flex:1;min-width:0;padding:0 16px 110px;max-width:880px;margin:0 auto;width:100%}
.ctx{display:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 0;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--bg);margin-top:calc(-1*env(safe-area-inset-top,0px))}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.02em}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;min-height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mut);font-weight:600;transition:.2s}
.nav button.on,.side button.on{color:var(--blue);background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(20,184,166,.12))}
.nav i,.side i{font-style:normal;font-size:20px}
.side button{display:flex;gap:12px;align-items:center;min-height:46px;padding:0 14px;border-radius:12px;font-weight:600;color:var(--mut);text-align:left}
h1{font-size:26px;line-height:1.2;font-weight:800;margin:8px 0 4px}h2{font-size:18px;margin:24px 0 10px;font-weight:700}
p.s,.s{color:var(--mut);font-size:15px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(16,42,67,.05),0 8px 24px rgba(16,42,67,.05);border:1px solid var(--line);margin-bottom:12px;animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.b{font-weight:700}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--blue),var(--teal));flex:none}
.btn{min-height:48px;padding:0 20px;border-radius:14px;font-weight:700;background:linear-gradient(135deg,#1d4ed8,var(--blue));color:#fff;transition:transform .1s}
.btn:active{transform:scale(.97)}.btn.t{background:linear-gradient(135deg,#0f9d8f,var(--teal))}
.btn.g{background:var(--soft);color:var(--navy)}.btn.sm{min-height:40px;padding:0 14px;font-size:14px}.btn.w{width:100%}
.bdg{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft)}
.bdg.ok{background:rgba(20,184,166,.15);color:#0d8579}.bdg.wn{background:rgba(245,158,11,.16);color:#a16207}.bdg.in{background:rgba(59,130,246,.14);color:#2563eb}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat b{display:block;font-size:30px;font-weight:800;line-height:1.1}.stat span{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:15px}.chip.on{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:none}.hs .card{flex:none;width:240px;scroll-snap-align:start}
.inp{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 16px}
.tl{position:relative;padding-left:34px;margin-top:14px}.tl:before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--blue),var(--teal));box-shadow:0 0 12px rgba(20,184,166,.55);transform-origin:top;animation:grow 1.6s ease-out}
@keyframes grow{from{transform:scaleY(0)}}
.ev{position:relative;width:100%;text-align:left;display:block;margin-bottom:12px;animation:up .45s both}
.ev:before{content:"";position:absolute;left:-30px;top:20px;width:15px;height:15px;border-radius:50%;background:var(--card);border:4px solid var(--teal);box-shadow:0 0 0 4px rgba(20,184,166,.18)}
.ev.up:before{border-color:var(--blue);animation:pl 2s infinite}@keyframes pl{50%{box-shadow:0 0 0 8px rgba(59,130,246,.05)}}
.ev .card{margin:0}.dt{font-size:12px;letter-spacing:.08em;font-weight:800;color:var(--teal)}
.tabs{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin:12px 0}.tabs button{flex:1;min-height:44px;border-radius:11px;font-weight:700;color:var(--mut)}.tabs .on{background:var(--card);color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(16,42,67,.45);animation:fi .2s}@keyframes fi{from{opacity:0}}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:24px 24px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;max-width:560px;margin:0 auto;animation:sl .3s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{transform:translateY(100%)}}.sh:before{content:"";display:block;width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.kv{padding:10px 0;border-bottom:1px solid var(--line)}.kv small{display:block;font-size:12px;letter-spacing:.08em;font-weight:800;color:var(--mut)}
.fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:0 8px 24px rgba(59,130,246,.4)}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .3s}
.ck{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;flex:none;border:2px solid #f59e0b;color:#a16207}.ck.ok{background:var(--teal);border-color:var(--teal);color:#fff;animation:pop .3s}@keyframes pop{50%{transform:scale(1.2)}}
.sk{height:84px;border-radius:20px;margin-bottom:12px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sm 1.2s infinite}@keyframes sm{to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}.empty big{font-size:40px;display:block}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:520px;margin:0 auto;gap:18px;background:radial-gradient(circle at 80% 0,rgba(20,184,166,.18),transparent 50%),radial-gradient(circle at 0 30%,rgba(59,130,246,.14),transparent 50%)}
.path{display:flex;align-items:center;justify-content:space-between;padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--line)}.path span{font-weight:700;font-size:14px;text-align:center}.path em{flex:1;height:3px;margin:0 8px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--teal),var(--blue));background-size:200%;animation:fl 2s linear infinite}@keyframes fl{to{background-position:-200%}}
.sr{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:16px;animation:fi .15s}.sr>div{max-width:640px;margin:0 auto}
kbd{font:600 12px Manrope;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--mut)}
@media(min-width:768px){.main{padding:0 28px 40px}.grid4{grid-template-columns:repeat(4,1fr)}.sh{border-radius:24px;bottom:auto;top:50%;left:50%;right:auto;width:520px;transform:translate(-50%,-50%);animation:fi .2s}.fab{bottom:24px}}
@media(min-width:1024px){.side{display:flex}.nav{display:none}.main{padding-bottom:40px}.hide-d{display:none}}
@media(min-width:1280px){.ctx{display:block;width:300px;padding:28px 20px;position:sticky;top:0;height:100vh;overflow:auto;border-left:1px solid var(--line)}}
body:before,body:after{content:"";position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(70px);opacity:.2;z-index:-1;pointer-events:none;animation:bl 14s ease-in-out infinite alternate}
body:before{background:var(--blue);top:-100px;left:-100px}body:after{background:var(--teal);bottom:-100px;right:-100px;animation-delay:-7s}@keyframes bl{to{transform:translate(80px,50px) scale(1.25)}}
.gt{background:linear-gradient(120deg,var(--navy),var(--blue) 55%,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.tl:after{content:"";position:absolute;left:6px;top:0;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(20,184,166,.35),0 0 20px 6px var(--teal);opacity:0;animation:orb 2.4s .3s ease-in-out forwards}
@keyframes orb{0%{top:0;opacity:1}90%{opacity:1}100%{top:calc(100% - 14px);opacity:0}}
.rt{display:flex;align-items:center;margin:14px 4px 6px}.rt i{width:14px;height:14px;border-radius:50%;background:var(--teal);flex:none;animation:pop .4s both}.rt i.n{background:var(--blue);box-shadow:0 0 0 5px rgba(59,130,246,.2)}
.rt b{flex:1;height:3px;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:3px;transform-origin:left;animation:g2 .5s both}@keyframes g2{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="root"></div>
<script>
const P=[["Priya Sharma",28,"18 Sep","03 Oct","Ready for review",14,"PS"],["Ananya Patel",34,"02 Sep","03 Oct","Questionnaire received",9,"AP"],["Sneha Verma",31,"21 Aug","03 Oct","Needs preparation",6,"SV"],["Kavya Joshi",26,"11 Sep","07 Oct","Awaiting documents",5,"KJ"],["Meera Kulkarni",39,"29 Aug","09 Oct","Ready for review",11,"MK"],["Riya Deshmukh",30,"05 Sep","12 Oct","Needs preparation",4,"RD"]].map((a,i)=>({id:i,n:a[0],age:a[1],last:a[2],next:a[3],st:a[4],rec:a[5],i:a[6]}));
const EV=[["12 JAN","First consultation","Consultation note added","Consultation Note.pdf","Consultation"],["04 FEB","Document uploaded","Previous consultation record","Previous Record.pdf","Document"],["10 MAR","Report uploaded","Document available","Report_Mar.pdf","Report"],["18 APR","Consultation","Care-team note recorded","Consultation Note.pdf","Consultation"],["20 MAY","Prescription uploaded","Document available","Prescription_May.pdf","Prescription"],["18 JUN","Follow-up","Consultation note added","Follow-up Note.pdf","Consultation"],["03 OCT","Upcoming consultation","Appointment scheduled","—","Appointment"]];
let DOCS=[["Consultation Note","Consultations","18 Sep 2026","Dr. Mehta's clinic"],["Uploaded Document","Other","30 Sep 2026","Patient upload"],["Prescription","Prescriptions","10 Sep 2026","Care team"],["Report","Reports","10 Mar 2026","Patient upload"],["Referral Letter","Referrals","02 Feb 2026","Care team"],["Consultation Note","Consultations","18 Jun 2026","Dr. Mehta's clinic"]];
const FU=[["Requested Document","Priya Sharma","Added: 30 Sep",0],["Update follow-up status","Priya Sharma","Added: 01 Oct",0],["Questionnaire","Ananya Patel","Completed: 02 Oct",1],["Requested Document","Kavya Joshi","Added: 28 Sep",0],["Reminder sent","Riya Deshmukh","Added: 27 Sep",0],["Document received","Meera Kulkarni","Completed: 30 Sep",1]].map(a=>({t:a[0],p:a[1],d:a[2],done:a[3]}));
const NT=[["New document uploaded","Priya Sharma · 30 Sep","2h ago"],["Questionnaire completed","Priya Sharma · 03 Oct","4h ago"],["Consultation tomorrow","Kavya Joshi · 07 Oct","6h ago"],["Follow-up marked complete","Ananya Patel","Yesterday"]];
const Q=[["Have there been any changes since your last consultation?","text"],["Would you like to share anything with your care team before your appointment?","text"],["Have you uploaded the documents requested by your care team?","yn"],["Is there any information from your previous consultation you would like the care team to review?","text"],["Attach any additional document (optional)","file"]];
const S={scr:"welcome",pid:0,tab:"Timeline",pf:"All",df:"All",fu:"All",dq:"",sheet:null,qi:2,qa:{},qdone:0,load:0,find:0,sq:"",up:null};
const $=s=>document.querySelector(s),h=x=>x;
const logo=(s=30)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40" fill="none" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3B82F6"/><stop offset="1" stop-color="#14B8A6"/></linearGradient></defs><path d="M20 35C8 26 5 17 10 12c4-4 9-2 10 3 1-5 6-7 10-3 5 5 2 14-10 23Z" stroke="url(#g)" stroke-width="3" stroke-linejoin="round"/><path d="M8 24c6 0 7-6 12-6s6 5 12 2" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/></svg>`;
const NAV=[["home","🏠","Home"],["patients","👥","Patients"],["journey","🧭","Journey"],["tasks","✅","Tasks"],["profile","👤","Profile"]];
const SIDE=[["home","🏠","Dashboard"],["patients","👥","Patients"],["journey","🧭","Journey"],["docs","📄","Documents"],["tasks","✅","Follow-ups"],["quest","📝","Questionnaires"],["search","🔎","Search"]];
const pend=()=>FU.filter(f=>!f.done).length;
const av=p=>`<div class="av" aria-hidden="true">${p.i}</div>`;
const bd=(t,c="in")=>`<span class="bdg ${c}">${c=="ok"?"✓":c=="wn"?"○":"•"} ${t}</span>`;
const stc=s=>s=="Ready for review"||s=="Questionnaire received"?"ok":"wn";
const pc=(p,a)=>`<button class="card row w" style="text-align:left" data-a="pat" data-v="${p.id}">${av(p)}<div class="grow"><div class="b">${p.n}</div><div class="s">${p.age} years · Last visit: ${p.last}<br>Next visit: ${p.next}</div></div>${bd(p.st,stc(p.st))}</button>`;
const empty=(i,t,s)=>`<div class="empty"><big>${i}</big><div class="b" style="color:var(--navy)">${t}</div><div>${s}</div></div>`;
const dc=(d,i)=>`<div class="card row"><div class="av" style="background:var(--soft);color:var(--blue);border-radius:12px">📄</div><div class="grow"><div class="b">${d[0]}</div><div class="s">${d[2]} · ${d[3]}</div></div><button class="btn g sm" data-a="doc" data-v="${i}" aria-label="View ${d[0]}">View</button></div>`;
const ph=(t,s)=>`<h1>${t}</h1><p class="s">${s}</p>`;
const back=(a,v)=>`<button class="btn g sm" data-a="${a}" data-v="${v||""}" style="margin:8px 0">← Back</button>`;
function dash(){const ap=[0,1,2],tm=["09:30 AM","10:15 AM","11:00 AM"],ty=["Follow-up consultation","Routine consultation","Consultation"];
return`${ph("Good morning, Dr. Mehta","Here’s what needs your attention today.")}
<div class="grid4" style="margin-top:16px">${[["TODAY'S CONSULTATIONS",8],["PENDING DOCUMENTS",12],["FOLLOW-UPS",pend()+1],["QUESTIONNAIRES",4]].map(s=>`<div class="card stat" style="margin:0"><b>${s[1]}</b><span>${s[0]}</span></div>`).join("")}</div>
<div class="card" style="margin-top:16px"><div class="s b">TODAY’S ROUTE · FIRST 3 OF 8</div><div class="rt">${[0,1,2].map(k=>(k?`<b style="animation-delay:${k*.3}s"></b>`:"")+`<i class="${k?"":"n"}" style="animation-delay:${k*.3}s"></i>`).join("")}</div><div class="row s" style="justify-content:space-between"><span>09:30</span><span>10:15</span><span>11:00</span></div></div><h2>Today’s Consultations</h2>${ap.map(i=>{const p=P[i];return`<div class="card row">${av(p)}<div class="grow"><div class="dt">${tm[i]}</div><div class="b">${p.n}</div><div class="s">${ty[i]}</div></div><button class="btn t sm" data-a="prep" data-v="${i}">Prepare</button></div>`}).join("")}
<h2>Recent Patient Journeys</h2><div class="hs">${P.slice(0,4).map(p=>`<button class="card" style="text-align:left" data-a="jr" data-v="${p.id}"><div class="row">${av(p)}<div class="b">${p.n}</div></div><div class="s" style="margin-top:8px">Last activity: ${p.last}<br>${p.rec} records<br>Last consultation: ${p.last}</div></button>`).join("")}</div>`}
function pats(){const f=P.filter(p=>(S.pf=="All"||(S.pf=="Today"&&p.next=="03 Oct")||(S.pf=="Upcoming"&&p.next!="03 Oct")||(S.pf=="Needs Preparation"&&p.st.match(/Needs|Awaiting/)))&&p.n.toLowerCase().includes(S.dq.toLowerCase()));
return`${ph("Patients","")}<input class="inp" id="pq" value="${S.dq}" placeholder="Search patients, records or documents…" aria-label="Search patients" data-i="dq"><div class="chips" role="group">${["All","Today","Upcoming","Needs Preparation"].map(c=>`<button class="chip ${S.pf==c?"on":""}" data-a="pf" data-v="${c}" aria-pressed="${S.pf==c}">${c}</button>`).join("")}</div>${f.length?f.map(pc).join(""):empty("🔍","No matching records found.","Try a different name or filter.")}`}
function prof(){const p=P[S.pid];const act=[["03 Oct","Questionnaire completed"],["30 Sep","Document uploaded"],["18 Sep","Consultation note added"],["10 Sep","Prescription document uploaded"]];
const kv=(a,b)=>`<div class="kv"><small>${a}</small>${b}</div>`;
return`${back("patients")}<div class="card"><div class="row">${av(p)}<div class="grow"><h1 style="margin:0">${p.n}</h1><div class="s">${p.age} years · Patient ID: CP-${10248+p.id}</div></div></div><div class="row" style="margin-top:14px;flex-wrap:wrap"><button class="btn g grow" data-a="search">🔎 Search Records</button><button class="btn t grow" data-a="prep" data-v="${p.id}">Prepare Consultation</button></div></div>
<div class="card"><div class="b">Basic Information</div>${kv("DATE OF BIRTH","14 Mar 1998")}${kv("CONTACT","+91 98•••• 4521")}${kv("PREFERRED LANGUAGE","Hindi, English")}</div>
<div class="card"><div class="b">Care Journey</div>${kv("FIRST RECORDED VISIT","12 Jan 2026")}${kv("CONSULTATIONS","4")}${kv("DOCUMENTS",DOCS.length)}${kv("UPCOMING APPOINTMENT","03 Oct 2026")}<button class="btn w" style="margin-top:12px" data-a="jr" data-v="${p.id}">Open Patient Journey</button></div>
<h2>Recent Activity</h2><div class="tl">${act.map((a,i)=>`<div class="ev" style="animation-delay:${i*.12}s"><div class="dt">${a[0].toUpperCase()}</div><div class="b">${a[1]}</div></div>`).join("")}</div>`}
function jr(){const p=P[S.pid];let b="";
if(S.tab=="Timeline")b=`<div class="tl">${EV.map((e,i)=>`<button class="ev ${i==6?"up":""}" style="animation-delay:${.15+i*.22}s" data-a="ev" data-v="${i}" aria-label="${e[0]} ${e[1]}"><div class="card"><div class="dt">${e[0]}</div><div class="b">${e[1]}</div><div class="s">${e[2]}</div></div></button>`).join("")}</div>`;
else if(S.tab=="Documents")b=DOCS.map(dc).join("");
else b=[["03 Oct","Questionnaire completed"],["30 Sep","Document uploaded"],["18 Sep","Consultation note added"],["10 Sep","Prescription document uploaded"]].map(a=>`<div class="card row"><div class="dt">${a[0]}</div><div class="b">${a[1]}</div></div>`).join("");
return`${ph("Patient Journey","A chronological view of recorded healthcare interactions.")}<div class="card row" style="margin-top:14px">${av(p)}<div class="grow"><div class="b">${p.n}</div><div class="s">CP-${10248+p.id}</div></div><button class="btn t sm" data-a="prep" data-v="${p.id}">Prepare</button></div>
<div class="card" style="margin-top:12px"><div class="s b">JOURNEY ROUTE · 6 RECORDED, 1 UPCOMING</div><div class="rt">${EV.map((e,k)=>(k?`<b style="animation-delay:${k*.15}s"></b>`:"")+`<i class="${k==6?"n":""}" style="animation-delay:${k*.15}s"></i>`).join("")}</div><div class="row s" style="justify-content:space-between"><span>12 Jan</span><span>03 Oct</span></div></div><div class="tabs" role="tablist">${["Timeline","Documents","Activity"].map(t=>`<button role="tab" class="${S.tab==t?"on":""}" data-a="tab" data-v="${t}" aria-selected="${S.tab==t}">${t}</button>`).join("")}</div>${b}`}
function ring(it){const c=2*Math.PI*40,sg=c/5,n=it.filter(i=>i[2]).length;return`<svg viewBox="0 0 100 100" width="140" height="140" style="display:block;margin:12px auto" role="img" aria-label="${n} of 5 items ready">${it.map((x,k)=>`<circle cx="50" cy="50" r="40" fill="none" stroke="${x[2]?"#14B8A6":"#F59E0B"}" stroke-opacity="${x[2]?1:.5}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${sg-7} ${c}" transform="rotate(${-90+k*72+4} 50 50)" style="animation:fi .5s ${k*.15}s both"/>`).join("")}<text x="50" y="52" text-anchor="middle" font-size="22" font-weight="800" fill="currentColor" font-family="Manrope">${n}</text><text x="50" y="64" text-anchor="middle" font-size="7" fill="#64748B" font-family="Manrope">of 5 items ready</text></svg>`}

function welcome(){return`<main class="hero"><div class="logo" style="font-size:20px">${logo(40)} CAREPATH AI</div><h1 class="gt" style="font-size:36px;margin-top:20px">Every visit starts with a clearer journey.</h1><p class="s" style="font-size:17px">Organize patient information, prepare for consultations, and follow the journey — all in one place.</p><div class="path" style="padding:6px"><svg viewBox="0 0 420 200" width="100%" aria-hidden="true" style="display:block"><defs><linearGradient id="wg"><stop stop-color="#3B82F6"/><stop offset="1" stop-color="#14B8A6"/></linearGradient></defs><path id="wp" d="M30 140C100 20 160 200 210 100S330 10 390 70" fill="none" stroke="url(#wg)" stroke-width="5" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="800"><animate attributeName="stroke-dashoffset" to="0" dur="2.2s" fill="freeze"/></path>${[[30,140,"📄","Documents"],[210,100,"🧭","Timeline"],[390,70,"🩺","Consultation"]].map((n,k)=>`<g style="animation:fi .5s ${k*.9}s both"><circle cx="${n[0]}" cy="${n[1]}" r="20" fill="#fff" stroke="#14B8A6" stroke-width="3"/><text x="${n[0]}" y="${n[1]+6}" text-anchor="middle" font-size="18">${n[2]}</text><text x="${n[0]}" y="${n[1]+42}" text-anchor="middle" font-size="13" font-weight="700" fill="#64748B" font-family="Manrope">${n[3]}</text></g>`).join("")}<circle r="7" fill="#fff" stroke="#3B82F6" stroke-width="3"><animateMotion dur="4s" begin="2.2s" repeatCount="indefinite"><mpath href="#wp"/></animateMotion></circle></svg></div><button class="btn" data-a="home">Continue as Care Team</button><button class="btn g" data-a="demo">View Demo</button><p class="s" style="font-size:14px">Designed to organize healthcare information. Clinical decisions remain with healthcare professionals.</p><p class="s" style="font-size:13px;font-style:italic">Organize the journey. Prepare for the conversation. Keep clinical decisions human.</p></main>`}
function sheet(){if(!S.sheet)return"";return`<div class="ov" data-a="close"></div><div class="sh" role="dialog" aria-modal="true">${S.sheet}</div>`}
function srch(){if(!S.find)return"";const q=S.sq.toLowerCase(),m=x=>!q||x.toLowerCase().includes(q);

function upl(){const u=S.up;if(!u)return`<h2 style="margin-top:0">Upload Document</h2>${[["📷","Take Photo","a"],["📁","Upload File","b"],["📱","Choose from Device","c"]].map(o=>`<button class="btn g w row" style="margin-bottom:10px;justify-content:flex-start" data-a="up" data-v="${o[2]}">${o[0]} ${o[1]}</button>`).join("")}`;

const SC={welcome,home:dash,patients:pats,prof,journey:jr,prep,docs,tasks,quest,notif,profile:prf};

const act={prof:"patients",prep:"journey",notif:"home"}[S.scr]||S.scr,nm=S.scr=="docs"?"journey":act;

document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.disabled)return;const a=t.dataset.a;if(A[a]&&A[a](t.dataset.v)!=="x"&&!["nav","home","demo","out","patients","pat","prof","jr","prep","docs","tasks"].includes(a))render();else if(a=="tasks"||a=="docs")0;if(["close","vs"].includes(a))render()});
